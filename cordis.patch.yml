# @zzx0220/dsh-watchlist bundle patch: one Host row.
#
# `name` must equal package.json's "name" — the loader resolves this row by package
# name, and a mismatch installs silently without doing anything.
#
# The config below is only an initial default. Runtime changes made through the
# `watchlist_settings` tool are stored in <dataDir>/settings.json and take precedence,
# so users can tune behaviour by chatting and keep it across upgrades.
- insert:
    - id: watchlist
      name: '@zzx0220/dsh-watchlist'
      config:
        lookbackDays: 7
        # Empty means "follow the host's time zone"; an explicit zone is still honoured.
        timeZone: ''
        maxTopicsPerRun: 8
        schedule:
          enabled: true
          frequency: daily
          time: '08:30'
          weekdays:
            - 1
          monthday: 1
        push:
          channels:
            - session
        workspaceDir: null
        promptHint: true
